<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="robots" content="noindex">
  <title>Halaman Tidak Ditemukan — SiapTKA</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 480px);
      padding: 40px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(30, 58, 138, .1);
    }
    .logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 22px;
      font-weight: 800;
    }
    .code {
      margin: 0;
      color: var(--primary-light);
      font-size: clamp(64px, 18vw, 88px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: 1;
    }
    h1 { margin: 18px 0 8px; font-size: 23px; }
    p { margin: 0; color: var(--muted); font-size: 15px; }
    nav {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    a {
      min-height: 44px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { border-color: var(--primary-light); }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    a.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    a.primary:hover { background: var(--primary-light); }
    small { display: block; margin-top: 28px; color: #94a3b8; font-size: 12px; }
    @media (max-width: 420px) {
      main { padding: 32px 22px; }
      nav { flex-direction: column; }
      nav a { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">S</div>
    <p class="code" aria-label="Kesalahan 404">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Maaf, halaman yang Anda cari tidak tersedia atau alamatnya sudah berubah.</p>
    <nav aria-label="Navigasi">
      <a class="primary" data-app-link="index.html" href="/">Kembali ke Beranda</a>
      <a data-app-link="landing.html" href="/">Kunjungi SiapTKA</a>
    </nav>
    <small>SiapTKA — Latihan TKA</small>
  </main>
  <script>
    (function () {
      var segments = window.location.pathname.split('/').filter(Boolean);
      var projectRootIndex = segments.findIndex(function (segment) {
        return segment === 'siaptka-1' || segment === 'siaptka';
      });
      var appRoot = projectRootIndex < 0
        ? '/'
        : '/' + segments.slice(0, projectRootIndex + 1).join('/') + '/';

      document.querySelectorAll('[data-app-link]').forEach(function (link) {
        link.href = appRoot + link.getAttribute('data-app-link');
      });
    })();
  </script>
</body>
</html>
