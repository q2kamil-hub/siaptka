<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">

  <title>Latihan — SiapTKA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="head.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #f59e0b;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text); background: var(--bg);
      min-height: 100vh; line-height: 1.5;
    }
    a { text-decoration: none; color: inherit; }
    .hidden { display: none !important; }

    .wrap {
      max-width: 720px; margin: 0 auto; padding: 20px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; justify-content: center;
      font-weight: 800; font-size: 20px; color: var(--primary);
      margin-bottom: 24px;
    }
    .logo-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; display: grid; place-items: center;
      font-size: 16px; font-weight: 800;
    }
    .card {
      background: white; border-radius: 16px; border: 1px solid var(--border);
      padding: 28px; box-shadow: 0 10px 30px rgba(30,58,138,.08);
    }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 15px; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--primary-light); }
    input.kode-input {
      text-transform: uppercase; letter-spacing: 3px;
      font-family: 'Courier New', monospace; font-weight: 700; font-size: 18px;
      text-align: center;
    }
    .btn {
      display: inline-block; padding: 12px 20px; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 15px;
      cursor: pointer; border: none; transition: background .15s;
      text-align: center;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-accent { background: var(--accent); color: #78350f; }
    .btn-accent:hover { background: #d97706; color: white; }
    .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--primary); }
    .btn-block { width: 100%; }

    .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .back-link:hover { color: var(--primary); }

    /* ===== JOIN SCREEN ===== */
    #join-screen .card h2 { font-size: 22px; margin-bottom: 4px; }
    #join-screen .card .sub { font-size: 14px; color: var(--muted); margin-bottom: 16px; }

    /* ===== QUIZ HEADER ===== */
    .quiz-header {
      position: sticky; top: 0; z-index: 20;
      background: white; border-bottom: 1px solid var(--border);
      padding: 12px 20px; margin-bottom: 16px;
    }
    .quiz-header-inner {
      max-width: 720px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .quiz-info { font-size: 13px; color: var(--muted); }
    .quiz-info strong { color: var(--text); }
    .timer {
      padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 15px;
      background: #eff6ff; color: var(--primary); font-variant-numeric: tabular-nums;
    }
    .timer.warning { background: #fef3c7; color: #92400e; }
    .timer.danger { background: #fee2e2; color: #991b1b; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .6; } }

    /* progress bar */
    .progress-wrap {
      max-width: 720px; margin: 0 auto 16px;
      height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light));
      transition: width .3s;
    }

    /* ===== SOAL ===== */
    .soal-card {
      background: white; border-radius: 16px; border: 1px solid var(--border);
      padding: 28px; margin-bottom: 16px;
    }
    .soal-num {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      background: #eff6ff; color: var(--primary);
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; margin-bottom: 14px;
    }
    .soal-text { font-size: 17px; line-height: 1.6; margin-bottom: 22px; white-space: pre-wrap; }
    .pilihan {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; margin-bottom: 10px;
      border: 2px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: border-color .15s, background .15s;
      font-size: 15px; line-height: 1.5;
    }
    .pilihan:hover { border-color: var(--primary-light); background: #f8fafc; }
    .pilihan.selected {
      border-color: var(--primary); background: #eff6ff;
    }
    .pilihan input { display: none; }
    .pilihan .letter {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
      background: #f1f5f9; color: var(--muted);
      display: grid; place-items: center; font-weight: 700; font-size: 13px;
    }
    .pilihan.selected .letter { background: var(--primary); color: white; }
    .isian-input {
      width: 100%; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      font-family: inherit; font-size: 15px;
    }
    .isian-input:focus { border-color: var(--primary-light); outline: none; }

    /* uraian: teks panjang */
    .uraian-input {
      width: 100%; min-height: 140px; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      font-family: inherit; font-size: 15px; resize: vertical;
    }
    .uraian-input:focus { border-color: var(--primary-light); outline: none; }

    /* benar/salah: toggle dua tombol */
    .bs-group { display: flex; gap: 10px; }
    .bs-btn {
      flex: 1; padding: 14px 16px; border: 2px solid var(--border);
      border-radius: 12px; background: white; cursor: pointer;
      font-size: 16px; font-weight: 600; transition: border-color .15s, background .15s, color .15s;
    }
    .bs-btn:hover { border-color: var(--primary-light); }
    .bs-btn.active { border-color: var(--primary); background: var(--primary); color: white; }

    /* pg_kompleks: checkbox per opsi */
    .cb-pilihan {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; margin-bottom: 10px;
      border: 2px solid var(--border); border-radius: 12px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .cb-pilihan:hover { border-color: var(--primary-light); background: #f8fafc; }
    .cb-pilihan input { margin-top: 4px; width: 18px; height: 18px; flex-shrink: 0; }
    .cb-pilihan.checked { border-color: var(--primary); background: #eff6ff; }
    .cb-pilihan .cb-letter {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
      background: #f1f5f9; color: var(--muted);
      display: grid; place-items: center; font-weight: 700; font-size: 13px;
    }
    .cb-pilihan.checked .cb-letter { background: var(--primary); color: white; }

    /* memasangkan: dua kolom kiri/kanan */
    .match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .match-col { display: flex; flex-direction: column; gap: 8px; }
    .match-item {
      padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 15px; cursor: pointer; user-select: none;
      background: white; transition: border-color .15s;
    }
    .match-item:hover { border-color: var(--primary-light); }
    .match-item.selected { border-color: var(--primary); background: #eff6ff; }
    .match-item.kiri { text-align: right; font-weight: 600; }

    /* ===== NAV ===== */
    .nav-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 16px; background: white;
      border-radius: 12px; border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .nav-num {
      width: 36px; height: 36px; border-radius: 8px;
      background: #f1f5f9; color: var(--muted);
      border: 1.5px solid transparent;
      font-weight: 700; font-size: 13px; cursor: pointer;
      font-family: inherit;
    }
    .nav-num.answered { background: #dcfce7; color: #166534; }
    .nav-num.current { border-color: var(--primary); background: var(--primary); color: white; }

    .quiz-actions {
      display: flex; gap: 10px; margin-top: 16px;
    }
    .quiz-actions .btn { flex: 1; }

    /* ===== RESULT ===== */
    .result-hero { text-align: center; padding: 20px 0; }
    .result-hero .score {
      font-size: 72px; font-weight: 800; line-height: 1;
      color: var(--primary); margin: 12px 0;
    }
    .result-hero .label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    .result-hero .kategori {
      display: inline-block; padding: 6px 16px; border-radius: 999px;
      font-weight: 700; font-size: 14px; margin-top: 8px;
    }
    .kategori-great { background: #dcfce7; color: #166534; }
    .kategori-good { background: #dbeafe; color: #1e40af; }
    .kategori-mid { background: #fef3c7; color: #92400e; }
    .kategori-low { background: #fee2e2; color: #991b1b; }

    /* ===== CONFIRM MODAL ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal {
      background: white; border-radius: 16px; max-width: 420px; width: 100%;
      padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25);
      text-align: center;
    }
    .modal h3 { font-size: 18px; margin-bottom: 12px; }
    .modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }

    /* ===== TOAST ===== */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1f2937; color: white; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; opacity: 0; transition: all .25s; z-index: 200;
      max-width: 90%; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--danger); }
    #toast.success { background: var(--success); }

    /* ===== PEMBAHASAN ===== */
    .pembahasan-section { margin-top: 24px; }
    .pembahasan-title {
      font-size: 16px; font-weight: 800; margin-bottom: 12px;
      color: var(--primary);
    }
    .pembahasan-item {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 12px; background: #fafafa;
    }
    .pembahasan-item.benar { border-left: 4px solid var(--success); }
    .pembahasan-item.salah { border-left: 4px solid var(--danger); }
    .pembahasan-q {
      font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.5;
    }
    .pembahasan-row {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 13px; padding: 4px 0;
    }
    .pembahasan-row .label { color: var(--muted); }
    .pembahasan-row .val { font-weight: 700; }
    .pembahasan-row .val.benar { color: var(--success); }
    .pembahasan-row .val.salah { color: var(--danger); }

    /* ===== PEMBAHASAN: DAFTAR SEMUA OPSI ===== */
    .pembahasan-opsi-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .pembahasan-opsi {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
      background: white; font-size: 13px; line-height: 1.5;
    }
    .pembahasan-opsi .letter {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: #f1f5f9; color: var(--muted);
      display: grid; place-items: center; font-weight: 700; font-size: 12px;
    }
    .pembahasan-opsi .opsi-text { flex: 1; }
    .pembahasan-opsi.benar { border-color: var(--success); background: #f0fdf4; }
    .pembahasan-opsi.benar .letter { background: var(--success); color: white; }
    .pembahasan-opsi.salah { border-color: var(--danger); background: #fef2f2; }
    .pembahasan-opsi.salah .letter { background: var(--danger); color: white; }
    .opsi-tag {
      flex-shrink: 0; font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    }
    .tag-kunci { background: #dcfce7; color: #166534; }
    .tag-anda  { background: #fee2e2; color: #991b1b; }
    .pembahasan-opsi.benar .tag-anda { background: #bbf7d0; color: #166534; }
    .pembahasan-note { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

    @media (max-width: 600px) {
      .wrap { padding: 12px; }
      .card, .soal-card { padding: 20px; }
      .soal-text { font-size: 16px; }
      .result-hero .score { font-size: 56px; }
    }
  </style>
</head>
<body>

<!-- ============ JOIN SCREEN ============ -->
<div id="join-screen" class="wrap">
  <div class="brand"><div class="logo-mark">S</div> SiapTKA</div>
  <div class="card">
    <h2>Masuk Latihan</h2>
    <p class="sub">Masukkan kode kelas dari guru Anda.</p>

    <label>Kode Kelas</label>
    <input type="text" id="join-kode" class="kode-input" placeholder="ABC123" maxlength="8" autocomplete="off">

    <label>Nama Lengkap</label>
    <input type="text" id="join-nama" placeholder="Nama Anda" autocomplete="off">

    <label>Nomor Absen (opsional)</label>
    <input type="number" id="join-absen" placeholder="Contoh: 12" min="1">

    <label>PIN Kelas (jika ada)</label>
    <input type="text" id="join-pin" class="kode-input" placeholder="••••" maxlength="10" autocomplete="off">

    <button class="btn btn-primary btn-block" id="btn-join" onclick="doJoin()" style="margin-top:20px">
      Mulai Latihan
    </button>

    <p class="error-msg" id="join-msg"></p>
    <a href="./" class="back-link">← Kembali ke pilihan peran</a>
  </div>
</div>

<!-- ============ QUIZ SCREEN ============ -->
<div id="quiz-screen" class="hidden">
  <div class="quiz-header">
    <div class="quiz-header-inner">
      <div class="quiz-info">
        <div><strong id="q-class">—</strong></div>
        <div id="q-student">—</div>
      </div>
      <div class="timer" id="q-timer">--:--</div>
    </div>
  </div>
  <div class="progress-wrap" style="margin-left:auto; margin-right:auto;">
    <div class="progress-fill" id="q-progress" style="width:0%"></div>
  </div>

  <div class="wrap" style="padding-top:0">
    <div id="soal-container"></div>

    <div class="nav-grid" id="nav-grid"></div>

    <div class="quiz-actions">
      <button class="btn btn-outline" id="btn-prev" onclick="prevSoal()">← Sebelumnya</button>
      <button class="btn btn-outline" id="btn-next" onclick="nextSoal()">Selanjutnya →</button>
    </div>

    <button class="btn btn-primary btn-block" onclick="confirmSubmit()" style="margin-top:12px">
      Selesai & Kirim Jawaban
    </button>
  </div>
</div>

<!-- ============ RESULT SCREEN ============ -->
<div id="result-screen" class="hidden wrap">
  <div class="brand"><div class="logo-mark">S</div> SiapTKA</div>
  <div class="card">
    <div class="result-hero">
      <div class="label">Nilai Anda</div>
      <div class="score" id="res-skor">—</div>
      <div class="kategori" id="res-kategori">—</div>
    </div>
    <p style="text-align:center; color:var(--muted); font-size:14px; margin-top:16px" id="res-msg">
      Jawaban Anda telah dikirim ke guru.
    </p>
    <div id="pembahasan-container" class="pembahasan-section hidden"></div>
    <button class="btn btn-outline btn-block" onclick="location.reload()" style="margin-top:20px">
      Selesai
    </button>
  </div>
</div>

<!-- ============ CONFIRM MODAL ============ -->
<div id="confirm-modal" class="overlay hidden">
  <div class="modal">
    <h3>Kirim jawaban sekarang?</h3>
    <p id="confirm-desc">Anda masih memiliki soal yang belum dijawab.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" style="flex:1" onclick="closeConfirm()">Periksa Lagi</button>
      <button class="btn btn-primary" style="flex:1" onclick="doSubmit()" id="btn-final-submit">Ya, Kirim</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="api.js"></script>
<script>
// ==========================================
// STATE
// ==========================================
var state = {
  student: null,      // {id, nama, absen}
  cls: null,          // {id, nama_kelas, durasi_menit, tampil_pembahasan}
  questions: [],
  answers: {},        // soalId -> jawaban (string)
  currentIndex: 0,
  startTime: null,
  timerId: null,
  remainingSec: 0,
  submitted: false
};

// ==========================================
// AUTO-SAVE (localStorage)
// Kunci: siaptka_autosave_[class_id]_[student_id]
// Tujuan: jawaban tidak hilang saat refresh / koneksi terputus.
// Draft dihapus setelah submit berhasil.
// ==========================================
var AUTOSAVE_PREFIX   = 'siaptka_autosave_';
var AUTOSAVE_TTL_MS   = 7 * 24 * 60 * 60 * 1000; // 7 hari
var AUTOSAVE_DEBOUNCE = 500;                     // ms (khusus input isian)
var draftTimer = null;

function autosaveKey(classId, studentId) {
  if (!classId || !studentId) return null;
  return AUTOSAVE_PREFIX + classId + '_' + studentId;
}

/** Simpan state.answers + sisa waktu ke localStorage. */
function saveDraft() {
  var key = autosaveKey(state.cls && state.cls.id, state.student && state.student.id);
  if (!key || state.submitted) return;
  try {
    localStorage.setItem(key, JSON.stringify({
      v: 1,
      class_id: state.cls.id,
      student_id: state.student.id,
      answers: state.answers,
      remaining_sec: state.remainingSec,
      current_index: state.currentIndex,
      updated_at: new Date().toISOString()
    }));
  } catch (e) { /* private mode / kuota penuh — abaikan */ }
}

/** Debounce: hindari menulis localStorage pada setiap ketukan tombol. */
function scheduleDraftSave() {
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, AUTOSAVE_DEBOUNCE);
}

/** Baca draft + validasi bentuk & kepemilikan. @returns {object|null} */
function loadDraft() {
  var key = autosaveKey(state.cls && state.cls.id, state.student && state.student.id);
  if (!key) return null;
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || d.v !== 1) return null;
    if (String(d.class_id) !== String(state.cls.id)) return null;
    if (String(d.student_id) !== String(state.student.id)) return null;
    return d;
  } catch (e) { return null; }
}

/** Hapus draft milik murid+kelas ini (dipanggil setelah submit berhasil). */
function clearDraft() {
  var key = autosaveKey(state.cls && state.cls.id, state.student && state.student.id);
  if (!key) return;
  try { localStorage.removeItem(key); } catch (e) {}
}

/**
 * Pulihkan draft ke state.answers, timer, dan posisi soal terakhir.
 * @returns {number} jumlah jawaban yang dipulihkan
 */
function restoreDraft() {
  var d = loadDraft();
  if (!d) return 0;

  var validIds = {};
  state.questions.forEach(function (q) { validIds[q.id] = true; });

  var restored = 0;
  if (d.answers && typeof d.answers === 'object') {
    Object.keys(d.answers).forEach(function (soalId) {
      if (!validIds[soalId]) return;              // soal sudah tidak ada di paket
      var v = d.answers[soalId];
      if (v == null) return;
      if (typeof v === 'string' && v.trim() === '') return;
      // Simpan utk struktur (array/object) atau string as-is
      state.answers[soalId] = v;
      restored++;
    });
  }

  // Timer: lanjutkan dari sisa waktu terakhir (tidak reset ke durasi penuh)
  var totalSec = (state.cls.durasi_menit || 60) * 60;
  var sisa = parseInt(d.remaining_sec, 10);
  if (!isNaN(sisa)) {
    sisa = Math.max(0, Math.min(sisa, totalSec));
    state.remainingSec = sisa;
    // startTime digeser agar durasi_detik yang dilaporkan tetap akurat
    state.startTime = Date.now() - (totalSec - sisa) * 1000;
  }

  // Kembali ke soal terakhir yang dibuka
  var ci = parseInt(d.current_index, 10);
  if (!isNaN(ci) && ci >= 0 && ci < state.questions.length) state.currentIndex = ci;

  return restored;
}

/** Bersihkan draft kedaluwarsa (> 7 hari) agar localStorage tidak menumpuk. */
function pruneOldDrafts() {
  try {
    var now = Date.now();
    var stale = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(AUTOSAVE_PREFIX) !== 0) continue;
      var d = null;
      try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { d = null; }
      var t = (d && d.updated_at) ? Date.parse(d.updated_at) : NaN;
      if (isNaN(t) || (now - t) > AUTOSAVE_TTL_MS) stale.push(k);
    }
    stale.forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
    });
  } catch (e) { /* storage tidak tersedia — abaikan */ }
}

// ==========================================
// INGAT FORM JOIN
// Supaya setelah refresh murid cukup menekan "Mulai Latihan".
// Penting: student_id diturunkan dari NAMA, jadi nama harus sama
// agar draft jawaban (localStorage) tetap ditemukan.
// ==========================================
var JOIN_CACHE = 'siaptka_murid_lastjoin';

function saveJoinForm(kode, nama, absen, pin) {
  try {
    localStorage.setItem(JOIN_CACHE, JSON.stringify({
      kode: kode, nama: nama, absen: absen, pin: pin
    }));
  } catch (e) {}
}

function restoreJoinForm() {
  try {
    var raw = localStorage.getItem(JOIN_CACHE);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (!d) return;
    if (d.kode)  document.getElementById('join-kode').value  = d.kode;
    if (d.nama)  document.getElementById('join-nama').value  = d.nama;
    if (d.absen) document.getElementById('join-absen').value = d.absen;
    if (d.pin)   document.getElementById('join-pin').value   = d.pin;
    if (d.kode && d.nama) {
      var msg = document.getElementById('join-msg');
      msg.textContent = 'Data terakhir dipulihkan. Tekan "Mulai Latihan" untuk melanjutkan.';
      msg.style.color = 'var(--muted)';
    }
  } catch (e) {}
}

// ==========================================
// JOIN
// ==========================================
function doJoin() {
  var kode = document.getElementById('join-kode').value.trim().toUpperCase();
  var nama = document.getElementById('join-nama').value.trim();
  var absen = document.getElementById('join-absen').value.trim();
  var pin = document.getElementById('join-pin').value.trim();
  var msg = document.getElementById('join-msg');
  var btn = document.getElementById('btn-join');

  if (!kode) { msg.textContent = 'Kode kelas wajib diisi.'; return; }
  if (!nama) { msg.textContent = 'Nama wajib diisi.'; return; }

  // Validasi format kode kelas dan PIN (hanya huruf/angka, tanpa spasi)
  var kodeRegex = /^[A-Z0-9]+$/;
  if (!kodeRegex.test(kode)) {
    msg.textContent = 'Kode kelas hanya boleh mengandung huruf dan angka, tanpa spasi.';
    return;
  }
  if (pin && !/^[A-Z0-9]+$/.test(pin)) {
    msg.textContent = 'PIN hanya boleh mengandung huruf dan angka, tanpa spasi.';
    return;
  }

  msg.textContent = ''; msg.style.color = ''; btn.disabled = true; btn.textContent = 'Memeriksa...';

  API.joinClass(kode, nama, absen, pin).then(function (res) {
    if (!res.ok) { msg.textContent = res.message || 'Gagal masuk.'; return; }
    state.student = res.student;
    state.cls = res.class;
    saveJoinForm(kode, nama, absen, pin);   // ingat isian form untuk join berikutnya
    loadQuestions();
  }).catch(function (err) {
    msg.textContent = API.friendlyError(err);
  }).finally(function () {
    btn.disabled = false; btn.textContent = 'Mulai Latihan';
  });
}

function loadQuestions() {
  var msg = document.getElementById('join-msg');
  msg.textContent = 'Memuat soal...';

  API.getQuestions(state.cls.id, state.student.id).then(function (res) {
    if (!res.ok) {
      if (res.already_done) {
        clearDraft();                        // AUTO-SAVE: tidak ada latihan yang bisa dilanjutkan
        msg.textContent = 'Anda sudah mengerjakan latihan ini. Hubungi guru jika ada masalah.';
      } else {
        msg.textContent = res.message || 'Gagal memuat soal.';
      }
      return;
    }
    state.questions = res.questions || [];
    state.cls = res.class;
    if (!state.questions.length) {
      msg.textContent = 'Belum ada soal di paket ini.';
      return;
    }
    startQuiz();
  }).catch(function (err) {
    msg.textContent = API.friendlyError(err);
  });
}

// ==========================================
// QUIZ
// ==========================================
function startQuiz() {
  state.startTime = Date.now();
  state.remainingSec = (state.cls.durasi_menit || 60) * 60;
  state.currentIndex = 0;
  state.answers = {};

  // AUTO-SAVE: pulihkan draft (harus setelah answers direset & sebelum render/timer)
  var restored = restoreDraft();

  document.getElementById('join-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');

  document.getElementById('q-class').textContent = state.cls.nama_kelas;
  document.getElementById('q-student').textContent = state.student.nama +
    (state.student.absen ? ' · Absen ' + state.student.absen : '');

  renderNav();
  renderSoal();
  startTimer();
  window.scrollTo(0, 0);

  if (restored > 0) {
    toast('Melanjutkan latihan: ' + restored + ' jawaban dipulihkan.', 'success');
  }
}

function startTimer() {
  updateTimerDisplay();
  state.timerId = setInterval(function () {
    state.remainingSec--;
    if (state.remainingSec <= 0) {
      clearInterval(state.timerId);
      state.remainingSec = 0;
      updateTimerDisplay();
      autoSubmit();
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('q-timer');
  var m = Math.floor(state.remainingSec / 60);
  var s = state.remainingSec % 60;
  el.textContent = pad(m) + ':' + pad(s);
  el.className = 'timer';
  if (state.remainingSec <= 60) el.className = 'timer danger';
  else if (state.remainingSec <= 300) el.className = 'timer warning';
}
function pad(n) { return (n < 10 ? '0' : '') + n; }

function renderSoal() {
  var q = state.questions[state.currentIndex];
  var idx = state.currentIndex;
  var total = state.questions.length;
  var userAns = state.answers[q.id] || '';

  var html = '';
  html += '<div class="soal-card">';
  html += '  <span class="soal-num">Soal ' + (idx + 1) + ' dari ' + total + '</span>';
  html += '  <div class="soal-text">' + rich(q.pertanyaan) + '</div>';

  var tipe = q.tipe || 'pg';
  var pasangan = q.pasangan || [];

  if (tipe === 'pg' && q.pilihan && q.pilihan.length) {
    q.pilihan.forEach(function (p) {
      var letter = String(p).trim().charAt(0);
      var selected = (userAns === letter) ? ' selected' : '';
      html += '<label class="pilihan' + selected + '" data-letter="' + esc(letter) + '">';
      html += '  <span class="letter">' + esc(letter) + '</span>';
      html += '  <span>' + rich(p) + '</span>';
      html += '</label>';
    });
  } else if (tipe === 'pg_kompleks' && q.pilihan && q.pilihan.length) {
    var userArr = Array.isArray(userAns) ? userAns : (String(userAns).split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; }));
    q.pilihan.forEach(function (p) {
      var letter = String(p).trim().charAt(0);
      var checked = userArr.indexOf(letter) >= 0 ? 'checked' : '';
      html += '<label class="cb-pilihan ' + checked + '" data-letter="' + esc(letter) + '">';
      html += '  <input type="checkbox" value="' + esc(letter) + '" ' + checked + '>';
      html += '  <span class="cb-letter">' + esc(letter) + '</span>';
      html += '  <span>' + rich(p) + '</span>';
      html += '</label>';
    });
  } else if (tipe === 'benar_salah') {
    var selB = (userAns === 'benar') ? ' active' : '';
    var selS = (userAns === 'salah') ? ' active' : '';
    html += '<div class="bs-group">';
    html += '  <button type="button" class="bs-btn' + selB + '" data-val="benar">Benar</button>';
    html += '  <button type="button" class="bs-btn' + selS + '" data-val="salah">Salah</button>';
    html += '</div>';
  } else if (tipe === 'memasangkan' && pasangan && pasangan.length) {
    var matchState = state.answers[q.id];
    if (!matchState || typeof matchState !== 'object') matchState = {};
    html += '<div class="match-wrap">';
    html += '  <div class="match-col">';
    pasangan.forEach(function (pair, i) {
      var chosen = matchState[String(i)] || '';
      var sel = (chosen !== '') ? ' selected' : '';
      html += '    <div class="match-item kiri' + sel + '" data-idx="' + esc(i) + '">' + rich(pair.kiri) + '</div>';
    });
    html += '  </div>';
    html += '  <div class="match-col">';
    pasangan.forEach(function (pair, j) {
      var chosen = matchState[String(j)] || '';
      var sel = (chosen !== '') ? ' selected' : '';
      html += '    <div class="match-item' + sel + '" data-idx="' + esc(j) + '">' + rich(pair.kanan) + '</div>';
    });
    html += '  </div>';
    html += '</div>';
    html += '<div style="margin-top:8px; font-size:12px; color:var(--muted); text-align:center">Klik satu item di kiri lalu satu di kanan untuk pasangkan.</div>';
  } else {
    var isTextarea = (tipe === 'uraian');
    if (isTextarea) {
      html += '<textarea class="uraian-input" id="isian-' + q.id + '" placeholder="Ketik jawaban Anda...">' + esc(userAns) + '</textarea>';
    } else {
      html += '<input type="text" class="isian-input" id="isian-' + q.id + '" ' +
              'placeholder="Ketik jawaban..." value="' + esc(userAns) + '">';
    }
  }

  html += '</div>';
  document.getElementById('soal-container').innerHTML = html;

  var container = document.getElementById('soal-container');

  // PG tunggal
  container.querySelectorAll('.pilihan').forEach(function (el) {
    el.addEventListener('click', function () {
      var letter = el.getAttribute('data-letter');
      container.querySelectorAll('.pilihan').forEach(function (x) { x.classList.remove('selected'); });
      el.classList.add('selected');
      state.answers[q.id] = letter;
      saveDraft();
      updateNav();
      updateProgress();
    });
  });

  // PG kompleks
  container.querySelectorAll('.cb-pilihan').forEach(function (el) {
    el.addEventListener('click', function () {
      var letter = el.getAttribute('data-letter');
      var cb = el.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      el.classList.toggle('checked', cb.checked);
      var arr = state.answers[q.id];
      if (!Array.isArray(arr)) arr = [];
      var idx = arr.indexOf(letter);
      if (cb.checked) { if (idx < 0) arr.push(letter); }
      else { if (idx >= 0) arr.splice(idx, 1); }
      state.answers[q.id] = arr;
      saveDraft();
      updateNav();
      updateProgress();
    });
  });

  // Benar/salah
  container.querySelectorAll('.bs-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var val = btn.getAttribute('data-val');
      container.querySelectorAll('.bs-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.answers[q.id] = val;
      saveDraft();
      updateNav();
      updateProgress();
    });
  });

  // Memasangkan
  var matchSelected = { side: null, idx: null };
  container.querySelectorAll('.match-item').forEach(function (el) {
    el.addEventListener('click', function () {
      var side = el.classList.contains('kiri') ? 'kiri' : 'kanan';
      var idx = el.getAttribute('data-idx');
      if (matchSelected.side === side && matchSelected.idx === idx) {
        el.classList.remove('selected');
        matchSelected = { side: null, idx: null };
        return;
      }
      if (matchSelected.side && matchSelected.side !== side) {
        var kiriIdx = (matchSelected.side === 'kiri') ? matchSelected.idx : idx;
        var kananIdx = (matchSelected.side === 'kanan') ? matchSelected.idx : idx;
        var m = state.answers[q.id];
        if (!m || typeof m !== 'object') m = {};
        m[kiriIdx] = kananIdx;
        state.answers[q.id] = m;
        saveDraft();
        renderSoal();
        updateNav();
        updateProgress();
        return;
      }
      container.querySelectorAll('.match-item').forEach(function (x) { x.classList.remove('selected'); });
      el.classList.add('selected');
      matchSelected = { side: side, idx: idx };
    });
  });

  // Isian / Uraian
  var inputEl = document.getElementById('isian-' + q.id);
  if (inputEl) {
    inputEl.addEventListener('input', function () {
      state.answers[q.id] = inputEl.value;
      scheduleDraftSave();
      updateNav();
      updateProgress();
    });
  }

  updateNav();          // tandai nomor yang sudah dijawab (termasuk hasil auto-save)
  updateNavActive();
  updateProgress();
  updatePrevNextButtons();
}

function renderNav() {
  var html = '';
  state.questions.forEach(function (q, i) {
    html += '<button class="nav-num" data-idx="' + i + '" onclick="jumpTo(' + i + ')">' + (i + 1) + '</button>';
  });
  document.getElementById('nav-grid').innerHTML = html;
}

function isClientAnswered(v) {
  if (v == null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object' && v !== null) return Object.keys(v).length > 0;
  return String(v).trim() !== '';
}

function updateNav() {
  document.querySelectorAll('#nav-grid .nav-num').forEach(function (btn) {
    var i = parseInt(btn.getAttribute('data-idx'), 10);
    var q = state.questions[i];
    btn.classList.toggle('answered', isClientAnswered(state.answers[q.id]));
  });
}

function updateNavActive() {
  document.querySelectorAll('#nav-grid .nav-num').forEach(function (btn) {
    var i = parseInt(btn.getAttribute('data-idx'), 10);
    btn.classList.toggle('current', i === state.currentIndex);
  });
}

function updateProgress() {
  var answered = 0;
  state.questions.forEach(function (q) {
    if (isClientAnswered(state.answers[q.id])) answered++;
  });
  var pct = Math.round((answered / state.questions.length) * 100);
  document.getElementById('q-progress').style.width = pct + '%';
}

function updatePrevNextButtons() {
  document.getElementById('btn-prev').disabled = state.currentIndex === 0;
  document.getElementById('btn-next').disabled = state.currentIndex === state.questions.length - 1;
}

function jumpTo(i) {
  state.currentIndex = i;
  renderSoal();
}
function nextSoal() {
  if (state.currentIndex < state.questions.length - 1) {
    state.currentIndex++;
    renderSoal();
    window.scrollTo(0, 0);
  }
}
function prevSoal() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderSoal();
    window.scrollTo(0, 0);
  }
}

// ==========================================
// SUBMIT
// ==========================================
function countUnanswered() {
  var n = 0;
  state.questions.forEach(function (q) {
    var v = state.answers[q.id];
    if (v == null) { n++; return; }
    if (Array.isArray(v)) { if (v.length === 0) n++; return; }
    if (typeof v === 'object' && v !== null) { if (Object.keys(v).length === 0) n++; return; }
    if (String(v).trim() === '') n++;
  });
  return n;
}

function confirmSubmit() {
  var un = countUnanswered();
  var desc = document.getElementById('confirm-desc');
  if (un > 0) {
    desc.textContent = 'Masih ada ' + un + ' soal yang belum dijawab. Yakin ingin mengirim sekarang?';
  } else {
    desc.textContent = 'Semua soal sudah dijawab. Kirim jawaban Anda sekarang?';
  }
  document.getElementById('confirm-modal').classList.remove('hidden');
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.add('hidden');
}

function autoSubmit() {
  toast('Waktu habis! Jawaban dikirim otomatis.', 'error');
  doSubmit();
}

function doSubmit() {
  if (state.submitted) return;
  state.submitted = true;
  closeConfirm();

  var btn = document.getElementById('btn-final-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Mengirim...'; }

  if (state.timerId) clearInterval(state.timerId);

  var durasi = Math.floor((Date.now() - state.startTime) / 1000);

  API.submitResult({
    class_id: state.cls.id,
    student_id: state.student.id,
    jawaban: JSON.stringify(state.answers),
    durasi_detik: durasi
    }).then(function (res) {
    if (res.ok) {
      clearDraft();                                   // AUTO-SAVE: draft tak diperlukan lagi
      showResult(res.skor, null, res.pembahasan);
    } else {
      if (String(res.message || '').toLowerCase().indexOf('sudah') >= 0) {
        clearDraft();                                 // AUTO-SAVE: sudah submit di server
        showResult(0, res.message, null);
      } else {
        toast(res.message || 'Gagal mengirim.', 'error');
        state.submitted = false;
        if (btn) { btn.disabled = false; btn.textContent = 'Ya, Kirim'; }
      }
    }
  }).catch(function (err) {
    toast(API.friendlyError(err), 'error');
    state.submitted = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Ya, Kirim'; }
  });
}

function showResult(skor, customMsg, pembahasan) {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  var totalPossible = 0;
  state.questions.forEach(function (q) { totalPossible += parseInt(q.skor, 10) || 0; });
  var pct = totalPossible ? Math.round((skor / totalPossible) * 100) : 0;

  document.getElementById('res-skor').textContent = skor;

  var kat, katClass;
  if (pct >= 85) { kat = 'Sangat Baik'; katClass = 'kategori-great'; }
  else if (pct >= 70) { kat = 'Baik'; katClass = 'kategori-good'; }
  else if (pct >= 55) { kat = 'Cukup'; katClass = 'kategori-mid'; }
  else { kat = 'Perlu Bimbingan'; katClass = 'kategori-low'; }

  var katEl = document.getElementById('res-kategori');
  katEl.textContent = kat;
  katEl.className = 'kategori ' + katClass;

  if (customMsg) document.getElementById('res-msg').textContent = customMsg;

  // Render pembahasan jika ada
  if (pembahasan && pembahasan.length) {
    renderPembahasan(pembahasan);
  }

  window.scrollTo(0, 0);
}

function renderPembahasan(list) {
  var container = document.getElementById('pembahasan-container');
  var html = '<div class="pembahasan-title">📖 Pembahasan Jawaban</div>';

  list.forEach(function (item, i) {
    var tipe = String(item.tipe || 'pg').toLowerCase();
    var benar = !!item.benar;
    var kunci = String(item.kunci == null ? '' : item.kunci).trim();
    var user  = item.jawaban_user;
    var opsi  = (item.pilihan && item.pilihan.length) ? item.pilihan : [];
    var pasangan = item.pasangan || [];
    var earned = item.skor_diperoleh != null ? item.skor_diperoleh : (benar ? item.skor : 0);
    var maks = item.skor || 0;

    html += '<div class="pembahasan-item ' + (benar ? 'benar' : 'salah') + '">';
    html += '  <div class="pembahasan-q">' + (benar ? '✅' : '❌') + ' ' + (i + 1) + '. ' + rich(item.pertanyaan) + '</div>';
    html += '  <div class="pembahasan-skor">Skor: <b>' + earned + '/' + maks + '</b></div>';

    if (tipe === 'pg_kompleks') {
      html += renderPgKompleks(kunci, user, opsi);
    } else if (tipe === 'memasangkan') {
      html += renderMatchPembahasan(kunci, user, pasangan);
    } else if (tipe === 'benar_salah') {
      var u = String(user).trim().toLowerCase();
      var k = kunci.toLowerCase();
      var cocok = (u === k);
      html += '  <div class="pembahasan-row">';
      html += '    <span class="label">Jawaban Anda</span>';
      html += '    <span class="val ' + (cocok ? 'benar' : 'salah') + '">' + rich(u || '—') + '</span>';
      html += '  </div>';
      html += '  <div class="pembahasan-row">';
      html += '    <span class="label">Kunci Jawaban</span>';
      html += '    <span class="val benar">' + rich(kunci) + '</span>';
      html += '  </div>';
    } else if (opsi.length) {
      html += '  <div class="pembahasan-opsi-list">';
      opsi.forEach(function (p) {
        var letter = String(p).trim().charAt(0).toUpperCase();
        var isKunci = letter !== '' && letter === kunci.toUpperCase();
        var isUser  = letter !== '' && letter === String(user).trim().toUpperCase();
        var cls = isKunci ? 'benar' : (isUser ? 'salah' : '');
        html += '<div class="pembahasan-opsi ' + cls + '">';
        html += '  <span class="letter">' + esc(letter) + '</span>';
        html += '  <span class="opsi-text">' + rich(p) + '</span>';
        if (isKunci) {
          html += '<span class="opsi-tag tag-kunci">' + (isUser ? 'Jawaban Anda' : 'Kunci') + '</span>';
        } else if (isUser) {
          html += '<span class="opsi-tag tag-anda">Jawaban Anda</span>';
        }
        html += '</div>';
      });
      html += '  </div>';
      if (!String(user).trim()) {
        html += '  <div class="pembahasan-note">Anda tidak menjawab soal ini.</div>';
      }
    } else {
      html += '  <div class="pembahasan-row">';
      html += '    <span class="label">Jawaban Anda</span>';
      html += '    <span class="val ' + (benar ? 'benar' : 'salah') + '">' + rich(String(user == null ? '' : user) || '—') + '</span>';
      html += '  </div>';
      if (tipe !== 'uraian') {
        html += '  <div class="pembahasan-row">';
        html += '    <span class="label">Kunci Jawaban</span>';
        html += '    <span class="val benar">' + rich(kunci) + '</span>';
        html += '  </div>';
      } else {
        html += '  <div class="pembahasan-note">Penilaian uraian dilakukan secara manual di luar aplikasi.</div>';
      }
    }

    html += '</div>';
  });

  container.innerHTML = html;
  container.classList.remove('hidden');
}

function renderPgKompleks(kunci, user, opsi) {
  var kunciList = kunci.split(',').map(function (x) { return String(x).trim().toUpperCase(); }).filter(function (x) { return x !== ''; });
  var userArr = Array.isArray(user) ? user : (String(user).split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; }));
  var h = '  <div class="pembahasan-opsi-list">';
  opsi.forEach(function (p) {
    var letter = String(p).trim().charAt(0).toUpperCase();
    var isKunci = kunciList.indexOf(letter) >= 0;
    var isUser  = userArr.indexOf(letter) >= 0;
    var cls = '';
    if (isKunci && isUser) cls = 'benar';
    else if (isKunci) cls = 'benar';
    else if (isUser && !isKunci) cls = 'salah';
    h += '<div class="pembahasan-opsi ' + cls + '">';
    h += '  <span class="letter">' + esc(letter) + '</span>';
    h += '  <span class="opsi-text">' + rich(p) + '</span>';
    var tags = [];
    if (isKunci) tags.push('Kunci');
    if (isUser) tags.push('Jawaban Anda');
    if (tags.length) {
      h += '<span class="opsi-tag tag-' + (isKunci && isUser ? 'kunci' : 'anda') + '">' + tags.join(' / ') + '</span>';
    }
    h += '</div>';
  });
  h += '  </div>';
  if (!userArr.length) {
    h += '  <div class="pembahasan-note">Anda tidak menjawab soal ini.</div>';
  }
  return h;
}

function renderMatchPembahasan(kunci, user, pasangan) {
  var kunciMap = {};
  kunci.split(',').forEach(function (pair) {
    var parts = pair.split('-');
    if (parts.length === 2) kunciMap[String(parts[0]).trim()] = String(parts[1]).trim().toUpperCase();
  });
  var userMap = (typeof user === 'object' && user !== null && !Array.isArray(user)) ? user : {};
  var pasIdx = Object.keys(kunciMap);
  var h = '  <div class="match-wrap">';
  h += '    <div class="match-col">';
  pasIdx.forEach(function (k) {
    var kananKunci = kunciMap[k];
    var kananUser = userMap[k] || '';
    var cocok = (String(kananUser).toUpperCase() === kananKunci);
    var cls = cocok ? 'benar' : (kananUser !== '' ? 'salah' : '');
    h += '      <div class="match-item kiri ' + cls + '" data-idx="' + esc(k) + '">' + rich(pairKiriText(pasangan, k)) + '</div>';
  });
  h += '    </div>';
  h += '    <div class="match-col">';
  pasIdx.forEach(function (k) {
    var kananKunci = kunciMap[k];
    var kananUser = userMap[k] || '';
    var cocok = (String(kananUser).toUpperCase() === kananKunci);
    var cls = cocok ? 'benar' : (kananUser !== '' ? 'salah' : '');
    h += '      <div class="match-item ' + cls + '" data-idx="' + esc(k) + '">' + rich(pairKananText(pasangan, k)) + '</div>';
  });
  h += '    </div>';
  h += '  </div>';
  return h;
}

function pairKiriText(pasangan, idx) {
  var p = pasangan[parseInt(idx, 10)];
  return p ? p.kiri : '';
}
function pairKananText(pasangan, idx) {
  var p = pasangan[parseInt(idx, 10)];
  return p ? p.kanan : '';
}

// UTIL
// ==========================================
/** Escape penuh untuk konteks HTML (atribut & teks non-soal). */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/**
 * Escape penuh + pulihkan whitelist tag <sup> dan <sub>.
 * Dipakai HANYA untuk konten soal (pertanyaan, pilihan, pasangan, pembahasan).
 * Tag lain tetap di-escape sehingga aman dari XSS.
 */
function rich(s) {
  return esc(s)
    .replace(/&lt;sup&gt;/gi, '<sup>')
    .replace(/&lt;\/sup&gt;/gi, '</sup>')
    .replace(/&lt;sub&gt;/gi, '<sub>')
    .replace(/&lt;\/sub&gt;/gi, '</sub>');
}

var toastTimer;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 3500);
}
