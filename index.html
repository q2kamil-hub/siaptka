<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Masuk — SiapTKA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="head.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #f59e0b;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    a { text-decoration: none; color: inherit; }

    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 22px; color: var(--primary);
      margin-bottom: 28px;
    }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; display: grid; place-items: center;
      font-size: 18px; font-weight: 800;
    }

    .card {
      background: white; max-width: 460px; width: 100%;
      padding: 28px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(30,58,138,.10);
      border: 1px solid var(--border);
    }

    /* ===== PWA GATE BANNER ===== */
    #pwa-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    #pwa-banner .icon {
      font-size: 40px; margin-bottom: 12px;
    }
    #pwa-banner h3 {
      margin: 0 0 8px; color: #1e3a8a; font-size: 18px;
    }
    #pwa-banner p {
      font-size: 14px; color: #1e40af; margin: 8px 0;
    }
    #pwa-banner .hint {
      font-size: 12px; color: var(--muted); margin-top: 14px;
      line-height: 1.5;
    }
    #pwa-status {
      font-size: 13px; color: #92400e; background: #fffbeb;
      border: 1px solid #fde68a; border-radius: 8px;
      padding: 10px 12px; margin-top: 14px; line-height: 1.5;
    }

    /* ===== ROLE SELECTION ===== */
    #role-section h2 {
      font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px;
    }
    #role-section .subtitle {
      text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px;
    }
    .role-btn {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 18px 20px; margin-bottom: 12px;
      background: white; border: 2px solid var(--border); border-radius: 12px;
      cursor: pointer; text-align: left;
      transition: border-color .15s, transform .15s, box-shadow .15s;
      font-family: inherit;
    }
    .role-btn:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,99,235,.12);
    }
    .role-btn .role-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: grid; place-items: center; font-size: 24px; flex-shrink: 0;
    }
    .role-btn.guru .role-icon { background: #eff6ff; }
    .role-btn.murid .role-icon { background: #fef3c7; }
    .role-btn .role-text h4 {
      font-size: 16px; font-weight: 700; margin-bottom: 2px; color: var(--text);
    }
    .role-btn .role-text p {
      font-size: 13px; color: var(--muted);
    }

    .btn {
      display: inline-block; padding: 12px 20px; border-radius: 8px;
      font-weight: 600; font-size: 14px; cursor: pointer; border: none;
      transition: background .15s; text-align: center; font-family: inherit;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }

    .back-link {
      display: block; text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--muted);
    }
    .back-link:hover { color: var(--primary); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="brand">
    <div class="logo-mark">S</div>
    SiapTKA
  </div>

  <div class="card">

    <!-- BANNER INSTALL PWA (gerbang ketat) -->
    <div id="pwa-banner">
      <div class="icon">🔒</div>
      <h3 id="pwa-title">Buka SiapTKA dari aplikasi</h3>
      <p id="pwa-description">Untuk melanjutkan, buka SiapTKA dari ikon aplikasi di layar utama perangkat Anda.</p>
      <button id="pwa-install-button" class="btn btn-primary hidden" style="margin-top:16px" onclick="installPWA()">
        📲 Install Aplikasi ke Perangkat
      </button>
      <p class="hint" id="pwa-install-hint">Belum memasang aplikasi? Gunakan menu browser untuk menambahkan SiapTKA ke layar utama.</p>
    </div>

    <!-- PILIHAN PERAN (hanya tampil jika sudah terinstall) -->
    <div id="role-section" class="hidden">
      <h2>Selamat Datang</h2>
      <p class="subtitle">Pilih peran Anda untuk melanjutkan</p>

      <button class="role-btn guru" onclick="pilihPeran('guru')">
        <div class="role-icon">👩‍🏫</div>
        <div class="role-text">
          <h4>Saya Guru</h4>
          <p>Buat kelas & lihat laporan murid</p>
        </div>
      </button>

      <button class="role-btn murid" onclick="pilihPeran('murid')">
        <div class="role-icon">🧑‍🎓</div>
        <div class="role-text">
          <h4>Saya Murid</h4>
          <p>Masuk dengan kode kelas</p>
        </div>
      </button>
    </div>

  </div>

  <p id="pwa-status" class="hidden" role="status" aria-live="polite"></p>
  <a href="./landing" class="back-link">← Kembali ke halaman utama</a>

  <script>
    // ==========================================
    // PWA GATE: peran hanya tersedia saat aplikasi dibuka dalam mode terpasang.
    // ==========================================
    const pwaBanner = document.getElementById('pwa-banner');
    const roleSection = document.getElementById('role-section');
    const installButton = document.getElementById('pwa-install-button');
    const installHint = document.getElementById('pwa-install-hint');
    const pwaStatus = document.getElementById('pwa-status');
    const standaloneQuery = window.matchMedia
      ? window.matchMedia('(display-mode: standalone)')
      : null;
    const isStandalone = !!(
      (standaloneQuery && standaloneQuery.matches) ||
      window.navigator.standalone === true
    );

    let deferredPrompt = null;

    function bukaGerbang() {
      roleSection.classList.remove('hidden');
      pwaBanner.classList.add('hidden');
    }

    function setPwaStatus(message) {
      pwaStatus.textContent = message;
      pwaStatus.classList.remove('hidden');
    }

    function getInstallInstructions() {
      const ua = navigator.userAgent || '';
      const isAppleMobile = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isAppleMobile) {
        return "Di Safari, tekan Bagikan lalu pilih 'Tambah ke Layar Utama'. Setelah terpasang, buka SiapTKA dari ikon tersebut.";
      }
      if (/Android/i.test(ua)) {
        return "Di Chrome Android, buka menu ⋮ lalu pilih 'Install app' atau 'Tambahkan ke layar utama'. Setelah terpasang, buka SiapTKA dari ikon tersebut.";
      }
      return "Buka menu browser atau ikon instalasi di bilah alamat, pilih Install/Tambahkan ke layar utama, lalu jalankan SiapTKA dari ikon aplikasi.";
    }

    // Banner terlihat sejak HTML awal; pilihan peran hanya dibuka dari aplikasi terpasang.
    if (isStandalone) {
      bukaGerbang();
    } else {
      pwaBanner.classList.remove('hidden');
      installHint.textContent = getInstallInstructions();
    }

    // 2. Tangkap event install
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        installButton.classList.remove('hidden');
      }
    });

    async function installPWA() {
      if (!deferredPrompt) {
        installHint.textContent = getInstallInstructions();
        return;
      }

      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      installButton.classList.add('hidden');
      try {
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice.outcome === 'accepted') {
          setPwaStatus('SiapTKA sedang dipasang. Setelah selesai, buka aplikasi dari ikon di layar utama.');
        } else {
          installButton.classList.remove('hidden');
          setPwaStatus('Instalasi belum dilakukan. Anda tetap dapat memasang SiapTKA melalui menu browser.');
        }
      } catch (error) {
        installButton.classList.remove('hidden');
        setPwaStatus('Prompt instalasi tidak dapat dibuka. Silakan ikuti petunjuk pemasangan di atas.');
        console.error('[PWA] Gagal menampilkan prompt instalasi:', error);
      }
    }

    // Tetap di browser biasa setelah install; gerbang terbuka saat aplikasi diluncurkan.
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installButton.classList.add('hidden');
      setPwaStatus('SiapTKA sudah terpasang. Tutup halaman ini lalu buka aplikasi dari ikon di layar utama.');
    });

    // ==========================================
    // PILIH PERAN → redirect
    // ==========================================
    function pilihPeran(peran) {
      if (peran === 'guru') {
        window.location.href = './guru';
      } else {
        window.location.href = './murid';
      }
    }

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((error) => {
          setPwaStatus('Pendaftaran komponen offline gagal. Periksa koneksi, lalu muat ulang halaman.');
          console.error('[PWA] Gagal mendaftarkan service worker:', error);
        });
      });
    } else {
      setPwaStatus('Browser ini tidak mendukung komponen offline SiapTKA. Gunakan browser terbaru dan buka melalui HTTPS.');
    }
  </script>
</body>
</html>
